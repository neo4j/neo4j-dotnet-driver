# run `docker compose up` -d to start the Neo4j database running locally before running the examples

services:
  neo:
    image: neo4j:5.26
    ports:
      - 7687:7687
      - 7474:7474
    environment:
      - NEO4J_AUTH=neo4j/pass
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
      - NEO4J_dbms_security_auth__minimum__password__length=4